trigger:
  branches:
    include:
      - main 

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: acr-secrets
  - name: dockerRegistry
    value: 'kmviregistry.azurecr.io'
  - name: frontendImage
    value: 'ksailcalc-frontend'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: |
    echo "📦 Installing npm dependencies..."
    npm install
  displayName: 'Install npm dependencies'

# Quality gates — blocking, and placed BEFORE the build so a failure is diagnosed in seconds
# instead of after a Docker image has been produced. The backend's equivalent is
# TreatWarningsAsErrors; story C-C brought lint from 190 problems to zero so this can be enforced.
- script: |
    echo "🧹 Linting (must report zero problems)..."
    npm run lint
  displayName: 'Lint'

- script: |
    echo "🧪 Running unit tests..."
    # The hosted agent ships Chrome under one of these names. Resolving it here makes a missing
    # browser fail loudly instead of leaving Karma waiting for one.
    export CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium)
    npm run test:ci
  displayName: 'Unit tests'

- script: |
    npm run build
  displayName: 'Build Angular app'

- script: |
    echo "🔐 Logging in to Azure Container Registry"
    echo "$(ACR_PASSWORD)" | docker login $(dockerRegistry) -u $(ACR_USERNAME) --password-stdin
  displayName: "Login to ACR"

- script: |
    echo "🔨 Building Angular frontend image"
    docker build -t $(dockerRegistry)/$(frontendImage):$(Build.SourceBranchName)-$(Build.BuildId) \
                 -t $(dockerRegistry)/$(frontendImage):latest \
                 -f Dockerfile .
  displayName: "Build Frontend Docker Image"

- script: |
    echo "📦 Pushing Angular frontend image to ACR"
    docker push $(dockerRegistry)/$(frontendImage):$(Build.SourceBranchName)-$(Build.BuildId)
    docker push $(dockerRegistry)/$(frontendImage):latest
  displayName: "Push Frontend Image to ACR"