# Frontend CI Pipeline (azure-pipelines.frontend-ci.yml)
trigger:
  branches:
    include:
      - '*'
    exclude:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install npm dependencies'

- script: |
    npm run build
  displayName: 'Build Angular app'

- script: |
    docker build -f Dockerfile.local -t ksail-frontend:ci .
  displayName: 'Build Frontend Docker Image (local config)'

# No push to ACR, no login
