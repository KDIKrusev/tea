# Frontend CI Pipeline (azure-pipelines.frontend-ci.yml)
trigger:
  branches:
    include:
      - '*'
    exclude:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install npm dependencies'

# Quality gates — blocking. See azure-pipelines.yml for the reasoning.
- script: |
    npm run lint
  displayName: 'Lint'

- script: |
    export CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium)
    npm run test:ci
  displayName: 'Unit tests'

- script: |
    npm run build
  displayName: 'Build Angular app'

- script: |
    docker build -f Dockerfile.local -t ksail-frontend:ci .
  displayName: 'Build Frontend Docker Image (local config)'

# No push to ACR, no login
