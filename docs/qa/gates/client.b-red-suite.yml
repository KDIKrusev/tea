inverted_pass_condition: >-
  Unlike every other gate in this project, a green suite here is a failure. The reviewer must confirm
  that specs 1-3 fail, that each fails for the reason claimed, and that no assertion was relaxed to
  manufacture the failure. AC5's per-cell "last writer" table is the artifact that distinguishes a
  test that is red for the right reason from one that is red for a convenient one.

