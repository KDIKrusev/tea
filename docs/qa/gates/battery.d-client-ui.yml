story_title: 'Battery Increment D — Client UI (Battery Section, Contribution Panel, Profile v3)'
gate: PASS
status_reason: >-
  All 6 ACs met; two defects found and fixed during review (reactive-form [disabled] misuse on the
  DP checkbox; stale DP availability after profile restore). ng build clean after fixes. No client
  test harness exists project-wide — recorded as technical debt, not a story regression.
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-13T00:00:00Z'

top_issues:
  - id: QA-D-1
    severity: medium
    status: fixed_in_review
    finding: >-
      [disabled] attribute binding on a reactive formControlName checkbox is ignored by Angular
      (runtime warning; DP relevant-mode checkbox would not reliably disable). Fixed via
      control.enable()/disable({emitEvent:false}); tooltip moved to a wrapper span.
    suggested_owner: dev
    refs:
      - 'cl/src/app/features/vessel-input/vessel-input-form/battery-config-section/battery-config-section.component.ts'
      - 'cl/src/app/features/vessel-input/vessel-input-form/battery-config-section/battery-config-section.component.html'
  - id: QA-D-2
    severity: low
    status: fixed_in_review
    finding: >-
      Profile restore patches with emitEvent:false, so the battery section's dpHours subscription
      never fired and DP checkbox availability stayed stale. Fixed with refreshDpAvailability()
      invoked from the form via ViewChild after applyProfileInputValues.
    suggested_owner: dev
    refs:
      - 'cl/src/app/features/vessel-input/vessel-input-form/vessel-input-form.component.ts'

